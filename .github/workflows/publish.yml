name: Publish

on:
  push:
    branches: [main]
  # Lets you re-publish without pushing, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # The pre-render step (_render/build.py) turns data/*.yml into the CV
      # pages, so Python and PyYAML have to be present before Quarto renders.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned in requirements.txt so CI and a local render use the same
      # version. Bump it there, not here.
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      # Must run as its own step, not just as _quarto.yml's `pre-render`:
      # Quarto expands {{< include >}} directives while building the project
      # context, which happens *before* pre-render scripts execute. On a clean
      # checkout _generated/ doesn't exist yet, so the includes would fail.
      - name: Generate pages from data/*.yml
        run: python _render/build.py

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
