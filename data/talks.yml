# ---------------------------------------------------------------------------
# Talks, presentations, posters. Rendered on research.qmd by _render/build.py.
#
# Fields:
#   date       required, quoted string. ISO ("2025-06-14") sorts and formats
#              best, but any string is passed through as-is if unparseable.
#   title      required.
#   venue      required — conference, seminar series, institution.
#   slides_url optional. Omit the key (or leave null) and no link is shown.
#
# Entries are sorted newest-first at build time; order here doesn't matter.
# ---------------------------------------------------------------------------

talks:
  - date: "2025-06-14"
    title: "PLACEHOLDER — A Talk Title Describing the Work"
    venue: "PLACEHOLDER — Annual Conference of Some Society, Somewhere"
    slides_url: "https://example.com/placeholder-slides.pdf"

  - date: "2025-02-03"
    title: "PLACEHOLDER — An Earlier Talk, With No Slides Online"
    venue: "PLACEHOLDER — Departmental Seminar, University of Somewhere"
    slides_url: null
