# ---------------------------------------------------------------------------
# Talks, presentations, posters. Rendered on research.qmd by _render/build.py.
#
# Fields:
#   date       required, quoted string. ISO ("2025-06-14") sorts and formats
#              best, but any string is passed through as-is if unparseable.
#              "2026-08" renders as "August 2026" — use it when the exact day
#              isn't known rather than guessing one.
#   title      required.
#   venue      required — conference, seminar series, institution.
#   location   optional. City or host institution, on its own line.
#   slides_url optional. Omit the key (or leave null) and no link is shown.
#   event_url  optional. Link to the event or workshop page.
#
# Entries are sorted newest-first at build time; order here doesn't matter.
# ---------------------------------------------------------------------------

# Add entries in the form:
#
#   - date: "2026-06-14"
#     title: "The Title of the Talk"
#     venue: "Conference or Seminar Series"
#     location: "City"                               # or omit the key entirely
#     slides_url: "https://example.com/slides.pdf"   # or omit the key entirely

talks:
