# ---------------------------------------------------------------------------
# Single source of truth for everything about you that the site displays.
#
# Nothing in this file is hardcoded anywhere in the .qmd pages: cv.qmd, the
# identity lines on index.qmd and the positions/collaborations lists are all
# generated from here by _render/build.py. Edit this file, not the pages.
#
# Sources: LSHTM profile page, UCL profile page, LinkedIn (Aug 2026).
#
# Optional: create data/cv.private.yml (gitignored) with the same structure to
# overlay private details for local renders.
# ---------------------------------------------------------------------------

personal:
  name: "Luke Burton"
  # "PhD Researcher" is the wording your own UCL profile uses. LSHTM renders it
  # formally as "Research Student - MPhil/PhD - Epidemiology & Population Health".
  role: "PhD Researcher"
  affiliation: "Department of Infectious Disease Epidemiology and Dynamics, London School of Hygiene & Tropical Medicine"
  tagline: "Understanding and predicting the behavioural drivers of epidemic dynamics. Also economic evaluation of blood-borne virus screening."
  # Primary contact. The UCL and Imperial addresses are deliberately not listed
  # anywhere on the site. Move this to data/cv.private.yml if you'd rather it
  # weren't in a tracked file.
  email: "Luke.Burton1@student.lshtm.ac.uk"
  location: "London, UK"
  # Circular headshot on the About page. Path relative to the project root.
  # The image only renders if the file exists, so this is safe to leave set
  # while you find a photo you like.
  headshot: "images/headshot.jpg"
  # Rendered on the Now page only — kept out of cv.qmd so it never appears on
  # the professional CV.
  aside: "Also pulls pints behind the LSHTM bar — a few hundred of them so far."
  links:
    - label: "Email"
      url: "mailto:Luke.Burton1@student.lshtm.ac.uk"
    - label: "LSHTM profile"
      url: "https://www.lshtm.ac.uk/aboutus/people/burton.luke"
    - label: "UCL profile"
      url: "https://profiles.ucl.ac.uk/108469-luke-burton"
    - label: "ORCID"
      url: "https://orcid.org/0009-0004-3168-0413"
    - label: "Substack"
      url: "https://laburton.substack.com"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/luke-burton-7563511b1/"
    - label: "GitHub"
      url: "https://github.com/lukeburton02"
    # - label: "Google Scholar"  # Not yet — add when you have a profile
    #   url: ""

# ---------------------------------------------------------------------------
# Education. `end: null` renders as "Present".
# Dates are quoted strings so YAML doesn't reinterpret them.
#
# Each entry renders as up to four display lines:
#   department  — optional, its own line above the qualification
#   qualification · institution
#   grade       — optional, its own line (null where there isn't one)
#   notes       — thesis title and anything else, on the line below the grade
# ---------------------------------------------------------------------------
education:
  - qualification: "PhD, Epidemiology"
    institution: "London School of Hygiene & Tropical Medicine"
    department: "Department of Infectious Disease Epidemiology and Dynamics"
    start: "Sep 2025"
    end: null
    grade: null
    notes: "Thesis: *Understanding and predicting behavioural drivers of epidemic dynamics*."

  - qualification: "MSc Health Data Science"
    institution: "London School of Hygiene & Tropical Medicine"
    start: "Sep 2024"
    end: "Sep 2025"
    grade: "Distinction"
    notes: "Thesis: *Using machine learning to understand vaccine responses to influenza*."

  - qualification: "MMath Mathematics"
    institution: "University of Oxford"
    start: "Sep 2020"
    end: "Jun 2024"
    grade: "Merit"
    notes: "Thesis: *Branching process models for estimating the probability of a major infectious disease epidemic*."

# ---------------------------------------------------------------------------
# Roles: positions, appointments, employment.
# The PhD itself lives under `education` above, not here.
#
# `department` is optional and renders on its own line above the job title,
# the same way it does for education entries. Keep departments out of `notes`
# so they never run together with the prose description.
# ---------------------------------------------------------------------------
roles:
  - title: "Visiting Researcher"
    organisation: "Imperial College London"
    start: "Sep 2025"
    end: null
    notes: "Held alongside the PhD."

  - title: "Research Assistant, Health Economics (part-time)"
    organisation: "University College London"
    department: "Infectious Disease Informatics"
    start: "Oct 2025"
    end: null
    notes: "NIHR-funded work on cost-utility modelling and economic evaluation of blood-borne virus screening interventions."

  - title: "Disease Modelling Intern"
    organisation: "Big Data Institute"
    start: "Jul 2024"
    end: "Sep 2024"
    notes: "Vaccine equity and trachoma resurgence."

  - title: "Data Science Intern"
    organisation: "esure Group"
    start: "Jul 2023"
    end: "Sep 2023"
    notes: "Predicting crash rates and quoted premiums."

  # Pre-academic industry placement — delete if you'd rather the CV started at
  # the Big Data Institute.
  - title: "IT Consulting Intern"
    organisation: "Aire Logic"
    start: "Jul 2021"
    end: "Aug 2021"
    notes: "Proof-of-concept medical rostering system."

# ---------------------------------------------------------------------------
# Academic service and citizenship.
# ---------------------------------------------------------------------------
service:
  - title: "Early Career Researcher Representative"
    organisation: "Centre for the Mathematical Modelling of Infectious Diseases, LSHTM"
    start: "Mar 2026"
    end: null
    notes: "Helping organise and facilitate monthly meetings between researchers."

# ---------------------------------------------------------------------------
# People and groups collaborated with, NOT employers — the Research page says
# so above this list.
#
# Name institutions and teams, never individuals: the owner's standing rule is
# that no colleague is named on the public site.
# ---------------------------------------------------------------------------
collaborations:
  - organisation: "University of Bristol"
    notes: "Mathematical modelling team, on cost-effectiveness of emergency department blood-borne virus opt-out testing."
  - organisation: "University of Leicester"
    notes: "GPs and clinical staff, who help with data and interviews and answer costing questions for the blood-borne virus work."
  - organisation: "UK Health Security Agency (UKHSA)"
    notes: "Mainly on the PhD, on the policy-relevant side, held through the Imperial visiting post. Separately and much more marginally, a data source for the blood-borne virus work, with no active involvement on that side."

# ---------------------------------------------------------------------------
# Awards, grants, scholarships, prizes. Add entries in the form:
#   - title: "..."
#     awarder: "..."
#     year: "2024"
#     notes: ""
# Degree classifications are not awards — they live in `grade` on the
# education entries above.
# ---------------------------------------------------------------------------
awards:
  - title: "Health Data Science prize"
    awarder: "London School of Hygiene & Tropical Medicine"
    # Awarded for the 2024–25 MSc year; recorded as the year of completion so
    # the date column stays a single point, as elsewhere in this section.
    year: "2025"
    notes: "Highest GPA in the cohort."

# ---------------------------------------------------------------------------
# Skills, grouped by category.
# ---------------------------------------------------------------------------
skills:
  # Kept to four, and worded to match the Research page. Near-duplicates
  # (epidemiological modelling, health economics, cost-utility modelling) are
  # covered by the broader headings below — don't re-split them.
  - category: "Research interests"
    items:
      - "Infectious disease modelling"
      - "Machine learning"
      - "Social contact, mobility and attitude data"
      - "Economic evaluation"
  - category: "Software"
    items:
      - "R"
