# ---------------------------------------------------------------------------
# Single source of truth for everything about you that the site displays.
#
# Nothing in this file is hardcoded anywhere in the .qmd pages: cv.qmd, the
# identity lines on index.qmd and the positions/collaborations lists are all
# generated from here by _render/build.py. Edit this file, not the pages.
#
# Sources: LSHTM profile page, UCL profile page, LinkedIn (Aug 2026).
#
# Optional: create data/cv.private.yml (gitignored) with the same structure to
# overlay private details for local renders.
# ---------------------------------------------------------------------------

